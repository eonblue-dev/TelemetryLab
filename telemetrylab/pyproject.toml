[project]
name = "telemetrylab"
version = "0.1.0"
description = ""
authors = [
    {name = "Pedro Luis",email = "eonblue.dev@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (<3.0)",
    "numpy (>=2.4.6,<3.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "plotly (>=6.8.0,<7.0.0)",
    "fastf1 (>=3.8.3,<4.0.0)"
]

[tool.poetry]
packages = [{include = "telemetrylab", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]
